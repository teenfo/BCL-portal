# BCL Portal — nginx 호스트 설정 참조본 (docs/11 §2 표준 토폴로지)
# 규칙: 포트는 docker-compose.yml + 이 파일 2곳에서만 정의. 8080 폐기. 3000 직접 listen 금지(nginx만 경유).
# 운영 호스트 /etc/nginx/sites-available/bcl-portal 로 배치 후 sites-enabled 심링크 + certbot TLS.

upstream bcl_portal {
    server 127.0.0.1:3001;   # 운영 portal (staging=3101)
}

# (선택) race-service REST — nginx 경유 시 /race-api/ prefix로만 프록시. 그 외 직접 노출 금지.
upstream bcl_race {
    server 127.0.0.1:8001;   # 운영 race-service (staging=8101)
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;   # HTTP→HTTPS 강제
}

server {
    listen 443 ssl http2;
    server_name your-domain.example;         # ← 실제 도메인으로 교체

    # ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://bcl_portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # race-service REST(선택) — 필요 시 주석 해제
    # location /race-api/ {
    #     proxy_pass http://bcl_race/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
