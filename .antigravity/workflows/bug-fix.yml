name: Bug Fix

description: 버그 수정 시 따르는 표준 워크플로우 (5개 에이전트 체계)

---

## Workflow Variants

버그의 심각도에 따라 2가지 워크플로우로 구분됩니다:
1. **Critical Bug**: 서비스 중단, 데이터 손실, 보안 취약점 (P0/P1)
2. **Standard Bug**: UI/UX 문제, 사소한 기능 장애 (P2/P3)

---

## Critical Bug Workflow

### Step 1: Root Cause Analysis
**Agent**: Architect (Opus 4.6)  
**Duration**: 30분-1시간

**Actions**:
- 버그 재현 및 확인
- 근본 원인 분석
- 영향 범위 파악 (데이터, 보안, 서비스)
- 긴급 패치 vs 정식 수정 판단
- 롤백 여부 결정

**Deliverables**:
- Root cause analysis report
- Impact assessment
- Fix strategy

---

### Step 2: Fix Implementation
**Agent**: Senior Developer (Opus 4.5) 또는 Developer (Sonnet 4.5)  
**Duration**: 1-4시간 (Critical), 반나절-1일 (High)

**선택 기준**:
- **Senior Developer** (Opus 4.5): 비즈니스 로직, 보안, 데이터베이스
- **Developer** (Sonnet 4.5): UI/API, 일반 로직

**Actions**:
- Failing test 작성 (TDD)
- 버그 수정 구현
- 테스트 통과 확인
- 회귀 방지 코드 추가
- 관련 문서 업데이트

**Deliverables**:
- Bug fix implementation
- Regression tests
- Documentation update

---

### Step 3: Verification
**Agent**: QA (GPT OSS)  
**Duration**: 30분-2시간

**Actions**:
- 버그 수정 확인
- 회귀 테스트 실행
- 엣지 케이스 재확인
- 관련 기능 재테스트
- 사용자 시나리오 검증

**Deliverables**:
- Verification report
- Regression test results
- Sign-off (if passed)

---

### Step 4: Final Approval
**Agent**: Architect (Opus 4.6)  
**Duration**: 30분-1시간

**Actions**:
- 수정 방법 검토
- 사이드 이펙트 확인
- 배포 계획 승인
- 모니터링 계획 수립

**Deliverables**:
- Deployment approval
- Monitoring checklist
- Post-mortem plan (Critical만)

---

## Standard Bug Workflow

### Step 1: Analysis & Fix
**Agent**: Developer (Sonnet 4.5)  
**Duration**: 2-4시간

**Actions**:
- 버그 재현
- 원인 파악
- Failing test 작성
- 버그 수정
- 테스트 통과 확인

**Deliverables**:
- Bug fix
- Tests
- Brief explanation

---

### Step 2: Verification
**Agent**: QA (GPT OSS)  
**Duration**: 1-2시간

**Actions**:
- 수정 확인
- 기본 회귀 테스트
- 사용자 시나리오 확인

**Deliverables**:
- Verification sign-off

---

### Step 3: Review (Optional)
**Agent**: Architect (Opus 4.6) - 필요시만  
**Duration**: 30분-1시간

**Trigger**:
- 복잡한 수정
- 영향 범위가 큰 경우
- Developer가 요청한 경우

---

## Bug Severity Classification

| Severity | 정의 | 예시 | 워크플로우 |
|:---------|:-----|:-----|:-----------|
| **P0 (Critical)** | 서비스 완전 중단, 데이터 손실 | 서버 다운, DB 손상 | Critical + 즉시 처리 |
| **P1 (High)** | 주요 기능 장애, 보안 취약점 | 결제 실패, XSS 취약점 | Critical |
| **P2 (Medium)** | 일부 기능 문제, 사용성 저하 | UI 깨짐, 잘못된 검증 | Standard |
| **P3 (Low)** | 사소한 문제, 불편함 | 오타, 작은 스타일 이슈 | Standard (낮은 우선순위) |

---

## Emergency Response (P0)

### Immediate Actions (15분 이내)
1. **Architect**: 상황 파악 및 긴급 대응 팀 소집
2. **Senior Developer**: 롤백 여부 즉시 판단
3. **QA**: 영향 범위 확인 및 모니터링

### Hotfix Process (1-2시간 이내)
1. **Architect**: 임시 수정 vs 정식 수정 결정
2. **Senior Developer**: 최소한의 수정으로 긴급 패치
3. **QA**: 빠른 검증 (핵심 기능만)
4. **Architect**: 긴급 배포 승인

### Post-Incident (24시간 이내)
1. **Architect**: Post-mortem 미팅 주재
2. **모든 에이전트**: 원인 분석 및 재발 방지책 논의
3. **Architect**: Post-mortem 문서 작성
4. **QA**: 재발 방지 테스트 추가

---

## Collaboration Guidelines

### Bug Report Template
```markdown
## Bug: [제목]
**Severity**: P0/P1/P2/P3
**Reporter**: [Agent Name]

### Description
[버그 설명]

### Steps to Reproduce
1. [단계 1]
2. [단계 2]

### Expected vs Actual
- **Expected**: [예상 동작]
- **Actual**: [실제 동작]

### Impact
- Users affected: [수치 또는 범위]
- Business impact: [영향]

### Environment
- Browser/Device:
- Version:
```

### Communication
- **P0/P1**: 즉시 팀 전체에 알림
- **P2/P3**: 일반 버그 리포트로 처리
- 수정 완료 시 리포터에게 알림

### Documentation
- 모든 Critical Bug는 Post-mortem 작성
- 재발 방지책은 문서화하여 공유
- Known Issues 리스트 업데이트
