# 임시 워크플로우 — GitHub Secrets 등록 여부 확인용 (값은 출력하지 않음). 확인 후 삭제.
name: Secrets Check (temp)

on:
  push:
    branches: [claude/review-next-steps-kyfh8v]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check secrets presence (no values printed)
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          [ -n "$URL" ] && echo "NEXT_PUBLIC_SUPABASE_URL: SET" || echo "NEXT_PUBLIC_SUPABASE_URL: MISSING"
          [ -n "$KEY" ] && echo "NEXT_PUBLIC_SUPABASE_ANON_KEY: SET" || echo "NEXT_PUBLIC_SUPABASE_ANON_KEY: MISSING"
          case "$URL" in
            *meklaisrcpecuwwwakhv*) echo "URL_TARGET: current-project (meklai...)" ;;
            "") echo "URL_TARGET: n/a" ;;
            *) echo "URL_TARGET: DIFFERENT project — 값 갱신 필요" ;;
          esac
          KEY_LEN=$(printf %s "$KEY" | wc -c); echo "KEY_LENGTH: $KEY_LEN"
