name: Deploy to Cafe24

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: � Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, gd, xml, dom, json, mysql, curl
          tools: composer:v2

      - name: 📦 Install Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: �📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # cafe24의 경우 FTP 접속 시 기본 루트가 / 인 경우가 많음. 필요 시 /www/ 로 수정 확인 필요.
          server-dir: /www/ 
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/writable/cache/**
            **/writable/logs/**
            **/writable/session/**
            .gitignore
            README.md
            spark
            composer.lock
