name: Deploy to Cafe24

on:
  push:
    branches:
      - main
      - master
 
jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: 'CAFE24'
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, gd, xml, dom, json, mysql, curl
          tools: composer:v2

      - name: 📦 Install Dependencies
        run: composer install --no-dev --optimize-autoloader


      - name: 📦 Archive Release
        run: zip -r release.zip . -x "*.git*" ".github/*" "tests/*" "writable/cache/*" "writable/logs/*" "writable/session/*" ".gitignore" "README.md" "composer.lock" "tools/*"

      - name: 🚀 Upload & Execute (Native)
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          
          # Upload via SCP
          sshpass -p "${{ secrets.FTP_PASSWORD }}" scp -P 22 -o StrictHostKeyChecking=no release.zip ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:www/
          
          # Execute commands via SSH
          sshpass -p "${{ secrets.FTP_PASSWORD }}" ssh -p 22 -o StrictHostKeyChecking=no ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} << 'EOF'
            cd www/
            unzip -o release.zip
            rm release.zip
            
            # Permissions Fix (Ignore errors)
            chmod -R 755 tools || true
            
            # Fix PHP library path (MySQL client error)
            export LD_LIBRARY_PATH=/usr/local/mysql/lib:$LD_LIBRARY_PATH
            php -v
            
            # CI4 Migration Execution (Auto-confirm)
            echo "y" | php spark migrate --all
            
            # Cache Clear
            php spark cache:clear
          EOF

