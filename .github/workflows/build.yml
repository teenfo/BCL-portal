name: BCL Portal CI

# This workflow triggers on push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      # Using version 20 as it's the current LTS and compatible with Next.js 14+
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install project dependencies
      # We use 'npm ci' for a clean, deterministic install based on package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Run Linting
      # Checks for code quality issues using ESLint configuration
      - name: Run Lint
        run: npm run lint

      # 5. Run Cloudflare Build
      # Verifies the full deployment chain including next-on-pages adapter
      - name: Run Pages Build
        run: npm run pages:build
        env:
          # We need these environment variables for the build to pass
          # even if we aren't connecting to the real DB during build
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
