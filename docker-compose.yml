services:
  portal:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: bcl-portal:latest
    container_name: bcl-portal
    ports:
      - "8080:80"
    restart: unless-stopped
    env_file:
      - .env.local
