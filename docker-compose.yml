services:
  portal:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: bcl-portal:latest
    container_name: bcl-portal
    ports:
      - "8080:80"
    restart: unless-stopped
    env_file:
      - .env.local
    depends_on:
      - race-service

  race-service:
    build:
      context: ./race
    image: bcl-race-server:latest
    container_name: bcl-race-server
    restart: unless-stopped
    # Internal port 8000
