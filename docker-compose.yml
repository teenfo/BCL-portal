# BCL Portal 배포 구성 (docs/11 §2 표준 토폴로지)
#   portal       : 호스트 3001 → 컨테이너 3000 (127.0.0.1 바인딩, nginx만 경유)
#   race-service : 호스트 8001 → 컨테이너 8001 (privileged BLE, 운영 호스트만) — profile로 분리
# portal은 race 없이도 기동(장애 격리) → depends_on 없음. race는 `--profile race`로만 기동.
services:
  portal:
    image: bcl-portal:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_RACE_SERVICE_URL: ${NEXT_PUBLIC_RACE_SERVICE_URL:-}
    restart: unless-stopped
    # SRK 격리(docs/11 §2.4): .env 통째 주입(env_file) 금지 — SUPABASE_SERVICE_ROLE_KEY가
    # portal 런타임에 섞이지 않도록 필요한 변수만 화이트리스트.
    # NEXT_PUBLIC_*는 빌드타임 임베드가 기본이나 서버 런타임 참조 대비 유지.
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_RACE_SERVICE_URL: ${NEXT_PUBLIC_RACE_SERVICE_URL:-}
    ports:
      - "127.0.0.1:${PORTAL_HOST_PORT:-3001}:3000"

  race-service:
    image: bcl-race-server:latest
    build:
      context: ./race-service
    restart: unless-stopped
    env_file: .env
    # 실시간 BLE(PM5) 접근 — 운영 호스트 전용. staging 시뮬레이터는 privileged 불필요(별도 override).
    privileged: true
    ports:
      - "${RACE_HOST_PORT:-8001}:8001"
    profiles: ["race"]

  # 갤러리 셀피 얼굴 매칭 워커(docs/07 §8.3b) — Supabase 아웃바운드 폴링만, 포트 없음.
  # SRK 격리 규약 유지: env_file 통주입 대신 필요한 변수만 화이트리스트(SRK는 워커 필수).
  face-service:
    image: bcl-face-service:latest
    build:
      context: ./face-service
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.45}
      POLL_INTERVAL_S: ${FACE_POLL_INTERVAL_S:-5}
    volumes:
      - face-models:/data

volumes:
  face-models:
