# ============================================
# BCL Portal — Host Nginx Configuration
# Reverse Proxy → Docker (Next.js :3000)
# ============================================
# 
# 이 파일은 서버의 /etc/nginx/sites-available/bcl-portal 에 복사합니다.
# Docker 내부의 nginx.conf와는 별도입니다.
#
# 설치 방법:
#   sudo cp nginx-host.conf /etc/nginx/sites-available/bcl-portal
#   sudo ln -sf /etc/nginx/sites-available/bcl-portal /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;  # 도메인 설정 시 변경 (예: test.bclcrossfit.com)

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 클라이언트 업로드 크기 제한 (이미지 업로드)
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 지원 (Race Service, HMR 등)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 타임아웃 (이미지 업로드/처리 대기)
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Health Check 엔드포인트
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
