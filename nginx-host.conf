# BCL Portal 호스트 nginx (docs/11 §2.2 표준 토폴로지)
#   80 → portal(127.0.0.1:3001) / /race-api/ → race-service(127.0.0.1:8001)
#   포트 번호는 이 파일과 docker-compose.yml 2곳에서만 정의(문서는 링크만 — 드리프트 차단).
#   설치: scripts/server-setup.sh가 /etc/nginx/sites-available/bcl-portal로 복사·활성화.
#   TLS(443)는 도메인 확정 후 certbot --nginx로 추가(이 파일은 80 기본형 유지).
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # race-service REST/WS — SRK 비노출 경로만 프록시(docs/11 §2.4), 직접 8001 노출 금지
    location /race-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
