server {
    listen 80;
    listen 3000;
    server_name kch83.iptime.org 192.168.0.3 localhost;

    # Hide nginx version in Server header
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self), bluetooth=(self)" always;

    # HSTS — HTTPS 종료 환경에서만 활성화 (현재 80/3000 평문)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate Limiting — 운영 정책 확정 후 활성화
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    # limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # Client upload size limit (image uploads)
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Race Service)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
